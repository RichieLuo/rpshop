[package]
name = "rpshop"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "A Rust desktop prototyping studio"
license = "MIT"

[package.metadata.shop]
product-name = "RPShop"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
flate2 = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
lz4_flex = "0.11"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winres = "0.1"

[profile.dev]
incremental = false

[profile.release]
lto = "thin"
strip = true
